name: CI

on:
  push:
  workflow_dispatch:

permissions:  # least privilege: CI only needs to read the code
  contents: read

concurrency:  # a newer push cancels the older run on the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Virtual display for the dialog tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q xvfb > /dev/null
      - name: Unit tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN python -m pytest -q -rs tests --ignore=tests/windows
        env:
          FILEWIZARD_NO_MSOFFICE: "1"

  windows-shell:
    name: real Explorer context menu (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[dev]"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build native shell extension (MSVC)
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE /LD native\fwshell.cpp /Fe:native\fwshell.dll /link /DEF:native\fwshell.def shlwapi.lib ole32.lib shell32.lib user32.lib gdi32.lib uuid.lib
      - name: Cascade-limit experiment (informational)
        run: python tests/windows/menu_limit_experiment.py
        continue-on-error: true
      - name: Shell tests - classic registry menu
        run: python -m pytest -v -s tests/windows
        env:
          FILEWIZARD_SHELL_TEST: "1"
          FILEWIZARD_MENU_MODE: classic
      - name: Shell tests - native menu (DLL, machine-wide)
        run: python -m pytest -v -s tests/windows
        env:
          FILEWIZARD_SHELL_TEST: "1"
          FILEWIZARD_MENU_MODE: native
          FILEWIZARD_NATIVE_DLL: ${{ github.workspace }}\native\fwshell.dll
          # the runner is elevated, and elevated processes ignore per-user COM classes
          FILEWIZARD_REGISTER_MACHINE: "1"
      - name: Per-user native menu, seen by a NON-elevated process (experiment)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          FILEWIZARD_NATIVE_DLL: ${{ github.workspace }}\native\fwshell.dll
        run: |
          New-Item -ItemType File -Force "$env:LOCALAPPDATA\FileWizard\shell-debug" | Out-Null
          Remove-Item "$env:LOCALAPPDATA\FileWizard\shell.log" -ErrorAction SilentlyContinue
          python -m filewizard install
          [Environment]::SetEnvironmentVariable("FILEWIZARD_NONINTERACTIVE", "1", "User")
          [Environment]::SetEnvironmentVariable("FILEWIZARD_NO_NOTIFY", "1", "User")
          $py = (Get-Command python).Source
          try { ./tests/windows/nonelevated_probe.ps1 -Python $py -Probe "${{ github.workspace }}\tests\windows\shell_probe.py" -Click }
          finally {
            Write-Host "--- fwshell.dll log (per-user experiment) ---"
            if (Test-Path "$env:LOCALAPPDATA\FileWizard\shell.log") { Get-Content "$env:LOCALAPPDATA\FileWizard\shell.log" -Tail 20 } else { "(no log: the shell never loaded the DLL)" }
            python -m filewizard uninstall
          }
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: fwshell-dll
          path: native/fwshell.dll
      - name: Upload FileWizard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filewizard-log
          path: ~/AppData/Local/FileWizard/filewizard.log
          if-no-files-found: ignore

  installer:
    name: build + test Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install ".[dev]" pyinstaller
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build native shell extension (MSVC)
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE /LD native\fwshell.cpp /Fe:native\fwshell.dll /link /DEF:native\fwshell.def shlwapi.lib ole32.lib shell32.lib user32.lib gdi32.lib uuid.lib
      - name: Fetch OCR language data (English, fast model)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\tessdata | Out-Null
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile installer\tessdata\eng.traineddata
          Get-Item installer\tessdata\eng.traineddata | Select-Object Name, Length
      - name: Freeze with PyInstaller
        working-directory: installer
        run: pyinstaller filewizard.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer\filewizard.iss
          Get-Item dist\FileWizard-Setup.exe | Select-Object Name, Length
      - name: Silent install
        shell: pwsh
        run: |
          Start-Process dist\FileWizard-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $app = "${env:ProgramFiles}\FileWizard"
          if (-not ([Environment]::GetEnvironmentVariable("Path", "Machine") -like "*FileWizard*")) { throw "PATH entry not added" }
          & "$app\filewizard.exe" doctor
          & "$app\filewizard.exe" menu .pdf
          reg query "HKLM\Software\Classes\CLSID\{6E2B7D59-3D4A-4C61-9F0E-FA11E3A1D0C8}" /s > reg.txt
          if ($LASTEXITCODE -ne 0) { throw "native handler not registered (HKLM)" }
          Get-Content reg.txt
          $app = "${env:ProgramFiles}\FileWizard"
          Get-Content "$app\menu.tsv" -TotalCount 25
      - name: Smoke-test the installed exe
        shell: pwsh
        timeout-minutes: 10
        env:
          FILEWIZARD_NONINTERACTIVE: "1"  # no dialogs (e.g. the merge-order window) in CI
        run: |
          $app = "${env:ProgramFiles}\FileWizard"
          python -c "import pymupdf; d=pymupdf.open(); d.new_page().insert_text((72,72),'hi'); d.save('smoke.pdf')"
          & "$app\filewizard.exe" run pdf-to-png smoke.pdf
          if (-not (Test-Path smoke.png)) { throw "pdf-to-png failed in frozen build" }
          python -c "from PIL import Image; Image.new('RGB',(64,48),'red').save('smoke.jpg')"
          & "$app\filewizard.exe" run img-to-heic smoke.jpg
          if (-not (Test-Path smoke.heic)) { throw "heic failed in frozen build" }
          python -c "import imageio_ffmpeg,subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-loglevel','error','-f','lavfi','-i','testsrc=duration=2:size=160x120:rate=10','-f','lavfi','-i','sine=duration=2','-shortest','smoke.mp4'],check=True)"
          & "$app\filewizard.exe" run aud-to-mp3 smoke.mp4
          if (-not (Test-Path smoke.mp3)) { throw "ffmpeg (bundled) failed in frozen build" }
          & "$app\filewizard.exe" run vid-to-gif smoke.mp4
          if (-not (Test-Path smoke.gif)) { throw "video->gif failed in frozen build" }
          python -c "from PIL import Image, ImageDraw, ImageFont; im=Image.new('RGB',(1400,240),'white'); ImageDraw.Draw(im).text((40,60),'Invoice 2026 total 42',fill='black',font=ImageFont.truetype('arial.ttf',90)); im.save('ocr.png')"
          & "$app\filewizard.exe" run img-ocr ocr.png
          if (-not (Select-String -Path ocr.txt -Pattern "Invoice" -Quiet)) { throw "bundled OCR failed" }
          Write-Host "OK: OCR works out of the box"
          # broader frozen-build coverage: libraries with hidden imports are what break in installers
          python -c "import pymupdf; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,72),'Hello Word'); d.save('w.pdf'); d.save('w2.pdf')"
          "name,amount`nAda,10" | Out-File -Encoding utf8 data.csv
          "# Title`n`nSome **text**." | Out-File -Encoding utf8 notes.md
          $checks = @(
            @("pdf-to-docx", "w.pdf", "w.docx"),
            @("pdf-to-xlsx", "w.pdf", $null),
            @("img-to-avif", "smoke.jpg", "smoke.avif"),
            @("combine-pdf", "w.pdf w2.pdf", "w (merged).pdf"),
            @("7z", "data.csv", "data.7z"),
            @("doc-to-pdf", "notes.md", "notes.pdf"),
            @("data-to-xlsx", "data.csv", "data.xlsx"),
            @("pdf-to-pptx", "w.pdf", "w.pptx"),
            @("vid-under-custom -p mb=1", "smoke.mp4", "smoke (under 1 MB).mp4")
          )
          foreach ($c in $checks) {
            $args_ = @("run") + $c[0].Split(" ") + $c[1].Split(" ")
            & "$app\filewizard.exe" @args_ | Out-Null
            if ($c[2] -and -not (Test-Path $c[2])) { throw "frozen build: $($c[0]) did not produce $($c[2])" }
            Write-Host "OK: $($c[0])"
          }
          $t1 = (Measure-Command { & "$app\filewizard.exe" --version | Out-Null }).TotalSeconds
          $t2 = (Measure-Command { & "$app\filewizard.exe" run img-to-png smoke.jpg | Out-Null }).TotalSeconds
          Write-Host ("TIMING: startup {0:N2}s, JPG->PNG end to end {1:N2}s" -f $t1, $t2)
      - name: Installed app as a normal (non-elevated) user - menu + click Merge
        shell: pwsh
        env:
          FILEWIZARD_NONINTERACTIVE: "1"
          FILEWIZARD_NO_NOTIFY: "1"
        run: |
          # runas-started processes read the user's registry environment, not this step's
          [Environment]::SetEnvironmentVariable("FILEWIZARD_NONINTERACTIVE", "1", "User")
          [Environment]::SetEnvironmentVariable("FILEWIZARD_NO_NOTIFY", "1", "User")
          $py = (Get-Command python).Source
          ./tests/windows/nonelevated_probe.ps1 -Python $py -Probe "${{ github.workspace }}\tests\windows\shell_probe.py" -Click
      - name: Uninstall cleans up
        timeout-minutes: 10
        shell: pwsh
        run: |
          Start-Process "${env:ProgramFiles}\FileWizard\unins000.exe" -ArgumentList "/VERYSILENT" -Wait  # no /SUPPRESSMSGBOXES on purpose: silent must not prompt
          Start-Sleep 3
          reg query "HKLM\Software\Classes\CLSID\{6E2B7D59-3D4A-4C61-9F0E-FA11E3A1D0C8}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "shell extension still registered after uninstall" }
          reg query "HKLM\Software\Classes\*\shellex\ContextMenuHandlers\FileWizard" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "handler still registered after uninstall" }
          if (Test-Path "${env:ProgramFiles}\FileWizard\menu.tsv") { throw "menu.tsv left behind after uninstall" }
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -like "*FileWizard*") { throw "PATH entry left behind after uninstall: $machinePath" }
          if (Test-Path "$env:LOCALAPPDATA\FileWizard") { throw "settings folder left behind after uninstall" }
          $left = @(Get-ChildItem "${env:ProgramFiles}\FileWizard" -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -notlike "fwshell-*.dll" })
          if ($left.Count -gt 0) { throw "files left in Program Files: $($left.Name -join ', ')" }
          Write-Host "OK: uninstall left nothing behind (a shell DLL still loaded by Explorer is removed at next restart)"
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: FileWizard-Setup
          path: dist/FileWizard-Setup.exe
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log
          path: ~/AppData/Local/FileWizard/filewizard.log
          if-no-files-found: ignore

  office-windows:
    name: Office -> PDF on Windows (LibreOffice)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Word/PowerPoint/Excel -> PDF and combine
        run: python -m pytest -v tests/test_office.py
        env:
          FILEWIZARD_NO_MSOFFICE: "1"
          FILEWIZARD_REQUIRE_OFFICE: "1"

  # Push a tag like v0.3.0 and, once every job above passes, the installer is published as a GitHub Release.
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-shell, installer, office-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job may create the release
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('filewizard/__init__.py').read())[1])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != app version v$v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: FileWizard-Setup
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="FileWizard ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release was made by hand on GitHub (which also created the tag): attach the tested installer
            gh release upload "$GITHUB_REF_NAME" dist/FileWizard-Setup.exe --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/FileWizard-Setup.exe --title "$title" --notes-file docs/RELEASE_NOTES.md
          fi
