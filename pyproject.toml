[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filewizard"
version = "0.1.0"
description = "Right-click file conversions and PDF tools for Windows Explorer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "pillow-heif>=0.16",
    "pdf2docx>=0.5.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
filewizard = "filewizard.cli:main"

[tool.setuptools]
packages = ["filewizard"]
